kind = "mobile"
previewPath = "/"
title = "Archive Manager"
description = "An Android-first mobile archive manager for browsing files, creating and extracting archives, validating archive integrity, and organizing extracted content, with room for cloud, media, sharing, and secure-vault extensions."
version = "1.0.0"
id = "artifacts/archive-manager"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25809

[services.development]
run = "pnpm --filter @workspace/archive-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/archive-manager", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/archive-manager", "run", "serve" ]

[services.env]
PORT = "25809"
BASE_PATH = "/"
